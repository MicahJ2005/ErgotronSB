<template>
  <div if:true={showSpinner}>
    <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
  </div>
  <template if:true={selector_screen}>
    <div class="container">
      <div class="row">
        <div class="col-xs-12">
          <div class="contentWrap">
            <section class="leftContent">
              <article class="introContent">
                <h1 class="h1 h1__pageTitle">{label.labelReturnHeader}</h1>
                <h2 class="h2 h2__pageSubtitle">{label.labelPage1SubHeader}</h2>
                <p class="p__pageIntro">{label.labelPage1SubSubHeader}</p>
              </article>
              <article class="formContent">
                <section class="section__formFields">
                  <p class="input__fieldLabel input__fieldLabel--required"><span>{label.labelOrderNumberLabel}</span></p>
                  <div class="field-wrapper">
                    <lightning-input variant="label-hidden" class="input__fields" type="text" label={label.labelOrderNumberLabel} value={orderNumberText} onblur={handleOrderNumber} required></lightning-input>
                  </div>
                  <p class="input__fieldLabel input__fieldLabel--required"><span>{label.labelEmailLabel}</span></p>
                  <div class="field-wrapper">
                    <lightning-input variant="label-hidden" class="input__fields" type="text" label={label.labelEmailLabel} value={emailText} onblur={handleEmail} required></lightning-input>
                  </div>
                </section>
              </article>
            </section>
            <section class="rightContent">
              <aside class="pagePrimaryImg"></aside>
            </section>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-xs-12">
          <section class="section__endElems">
            <aside class="error-wrap">
              <template if:true={selector_screen_Error_invalid_Data}>
                <div class="error__labels">{label.labelErrorCantFind} <a href="https://contact.ergotron.com" target="_blank" title="Contact Ergotron Support"><span>{label.labelThankYouContactUs}</span></a> {label.labelForSupport}.</div>
              </template>
              <template if:true={selector_screen_Error_invalid_Date}>
                <div class="error__labels">{label.labelErrorPastWindow} <a href="https://contact.ergotron.com" target="_blank" title="Contact Ergotron Support"><span>{label.labelThankYouContactUs}</span></a>.</div>
              </template>
            </aside>
            <lightning-button variant="brand" label="Next" onclick={handleSubmit}></lightning-button>
          </section>
        </div>
      </div>
    </div>
  </template>
  <template if:true={item_selector_screen}>
    <div class="container">
      <div class="row">
        <div class="col-xs-12">
          <div class="contentWrap">
            <section class="leftContent">
              <article class="introContent">
                <h1 class="h1 h1__pageTitle">{label.labelReturnHeader}</h1>
                <h2 class="h2 h2__pageSubtitle">{label.labelPage2SubHeader}</h2>
                <p class="p__pageIntro">{label.labelPage2SubSubHeader}</p>
              </article>
            </section>
            <section class="rightContent">
              <aside class="pageSecondaryImg"></aside>
            </section>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-xs-12">
          <section class="itemContent">
            <article class="formContent">
              <h3 class="h3 h3__prodListHeader">{label.labelPage2ProdListHeader}</h3>
              <section class="section__formFields--pg2">
                <template for:each={returnObj.lines} for:item="line">
                    <div class="itemWrapper unchecked" key={line.productId} data-index={line.productId}>
                        <div class="prod-checkbox">
                            <lightning-input type="checkbox-button" 
                            label="return" 
                            name="checkbox" 
                            data-index={line.productId}
                            checked={line.returning}
                            onchange={handleReturningChange}
                            >
                            </lightning-input>
                        </div>
                      <div class="prod-imgWrap" data-index={line.productId} onclick={handleClick}><img src={line.productImage} /></div>
                      <div class="prod-detailsWrap" data-index={line.productId} onclick={handleClick}>
                        <h3 class="h3 h3__prodName">{line.productName}</h3>
                        <div class="prod-purchaseDetail">{label.labelPartNumber}: &nbsp; {line.productCode}</div>
                        <div class="prod-purchaseDetail">{label.labelQty}: &nbsp; {line.quantity}</div>
                        <div class="prod-formFields" if:true={line.returning}>
                            <div class="prod-returnReason">
                                <p class="input__fieldLabel input__fieldLabel--required"><span>{label.labelReasionLabel}</span></p>
                                <div class="prod-returnReason-field"><lightning-combobox variant="label-hidden" name="reason" value={line.reason} label={label.labelReasionLabel} placeholder="" options={options} data-index={line.productId} onchange={handleReasonChange} required class="validate" message-when-value-missing={label.labelMissingReason}>
                                </lightning-combobox></div>
                            </div>
                            <div class="prod-returnQty">
                                <p class="input__fieldLabel input__fieldLabel--required"><span>{label.labelQuantityLabel}</span></p>
                                <div class="prod-returnQty-field"><lightning-input variant="label-hidden" type="number" label={label.labelQuantityLabel} value={line.returnquantity} data-productid={line.productId} required onchange={handleReturnQuantityChange} class="validate" max={line.quantity} min=1 message-when-range-overflow={label.labelQuantityMax} message-when-range-underflow={label.labelQuantityMin}>
                                </lightning-input></div>
                            </div>
                            <div class="prod-returnPkg">
                                <p class="input__fieldLabel input__fieldLabel--required"><span>{label.labelPackagingLabel}</span></p>
                                <div class="prod-returnPkg-field"><lightning-radio-group variant="label-hidden" name={line.productId} label={label.labelPackagingLabel} options={returnOptions} onchange={handlePackagingChange} data-index={line.productId} required class="validate" type="radio" message-when-value-missing={label.Required}>
                                </lightning-radio-group></div>
                            </div>
                        </div>
                    </div>
                  </div>
                </template>
                <div class="btn__submit"><lightning-button class="submit-button" variant="brand" label="Submit" onclick={handlePage2Submit} disabled></lightning-button></div>
              </section>
            </article>
          </section>
        </div>
      </div>
    </div>
  </template>
  <template if:true={thank_you_screen}>
    <div class="container">
      <div class="row">
        <div class="col-xs-12">
          <div class="contentWrap">
            <section class="leftContent">
              <article class="introContent thankYouWrap">
                <h1 class="h1 h1__pageTitle">{label.labelReturnHeader}</h1>
                <h2 class="h2 h2__pageSubtitle--thankYou">{label.labelThankYou}</h2>
                <h2 class="h2 h2__pageSubtitle">{label.labelThankYouRequestRecieved}</h2>
                <p class="p__pageIntro"><template if:true={thank_you_email}>{label.labelThankYouMessage1}</template><template if:true={thank_you_representative}>{label.labelThankYouMessage2}</template></p>
                <p class="p__pageIntro p__pageIntro--qc">{label.labelThankYouConcern} <a href="https://contact.ergotron.com" target="_blank" title="Contact Ergotron Support"><span>{label.labelThankYouContactUs}</span></a>.</p>
              </article>
            </section>
            <section class="rightContent">
              <aside class="pagePrimaryImg"></aside>
            </section>
          </div>
        </div>
      </div>
    </div>
  </template>
  <!-- Using an html component in the site page instead of custom labels -->
  <!-- <div class="container">
    <div class="row">
      <div class="col-xs-12">
        <article class="disclaimer">
          <h4 class="h4 h4__pageDisclaimerTitle">{label.labelReturnPolicyLabel}</h4>
          <p>{label.labelReturnPolicy} <a href="https://www.ergotron.com/en-us/company/legal/shipping-and-returns" target="_blank" title="Ergotron Return Policy">{label.labelReturnPolicyLink}</a>.</p>
        </article>
      </div>
    </div>
  </div> -->
</template>
